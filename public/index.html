<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャットボット</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .response {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 8px;
      min-height: 50px;
      display: none;
    }
    .response.show {
      display: block;
    }
    .response.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .response.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .message-log {
      margin-top: 30px;
      border-top: 2px solid #eee;
      padding-top: 20px;
    }
    .message-log h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
    }
    .message-item {
      padding: 10px;
      background: #f9f9f9;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .message-item .timestamp {
      color: #888;
      font-size: 12px;
    }
    .message-item .name {
      font-weight: bold;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>チャットボット</h1>
    
    <div class="input-group">
      <label for="name">名前:</label>
      <input type="text" id="name" placeholder="あなたの名前を入力してください">
    </div>
    
    <button onclick="sayHello()">挨拶する</button>
    
    <div id="response" class="response"></div>
    
    <div class="message-log">
      <h2>メッセージ履歴</h2>
      <div id="messageList"></div>
    </div>
  </div>

  <script>
    async function sayHello() {
      const name = document.getElementById('name').value;
      const responseDiv = document.getElementById('response');
      
      if (!name) {
        responseDiv.textContent = '名前を入力してください';
        responseDiv.className = 'response show error';
        return;
      }
      
      try {
        const response = await fetch('/api/hello', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          responseDiv.textContent = data.message;
          responseDiv.className = 'response show success';
          loadMessages();
        } else {
          responseDiv.textContent = data.error || 'エラーが発生しました';
          responseDiv.className = 'response show error';
        }
      } catch (error) {
        responseDiv.textContent = '通信エラーが発生しました';
        responseDiv.className = 'response show error';
      }
    }
    
    async function loadMessages() {
      try {
        const response = await fetch('/api/messages');
        const messages = await response.json();
        
        const messageList = document.getElementById('messageList');
        messageList.innerHTML = '';
        
        messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'message-item';
          div.innerHTML = `
            <div class="timestamp">${new Date(msg.timestamp).toLocaleString('ja-JP')}</div>
            <div><span class="name">${msg.name}:</span> ${msg.message}</div>
          `;
          messageList.appendChild(div);
        });
      } catch (error) {
        console.error('Error loading messages:', error);
      }
    }
    
    loadMessages();
  </script>
</body>
</html>
